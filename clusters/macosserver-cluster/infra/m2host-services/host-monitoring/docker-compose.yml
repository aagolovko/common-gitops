services:
  fritz-exporter:
    image: pdreker/fritz_exporter:3
    restart: unless-stopped
    env_file:
      - ${HOME}/.env
    environment:
      FRITZ_HOSTNAME: "192.168.178.1"
      FRITZ_NAME: "Fritz!Box 6660 Cable"
      FRITZ_HOST_INFO: "True"
      FRITZ_LISTEN_ADDRESS: "0.0.0.0"
    ports:
      - "127.0.0.1:9787:9787"
