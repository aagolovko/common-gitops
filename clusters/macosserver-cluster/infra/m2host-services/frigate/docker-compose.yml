services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable@sha256:c707dfa94a2efc9e994165cc7968517ebc02edd5b391789e20f6ace006bf29e3
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./config:/config
      - ./media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
