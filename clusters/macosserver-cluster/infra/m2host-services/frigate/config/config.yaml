mqtt:
  enabled: false

objects:
  track:
    - person
    - car
    - bicycle
    - motorcycle
    - dog
    - cat

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 0
  alerts:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 10
      mode: active_objects
  detections:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 10
      mode: active_objects

cameras:
  cam_1:
    enabled: true
    friendly_name: Cam 1
    ffmpeg:
      inputs:
        - path: http://192.168.178.102:8080/video
          input_args: preset-http-mjpeg-generic
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    live:
      streams:
        Stream 1: http://192.168.178.102:8080/video
  cam_2:
    enabled: true
    friendly_name: Cam 2
    ffmpeg:
      inputs:
        - path: http://192.168.178.154:8080/video
          input_args: preset-http-mjpeg-generic
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    live:
      streams:
        Stream 1: http://192.168.178.154:8080/video

version: 0.17-0
