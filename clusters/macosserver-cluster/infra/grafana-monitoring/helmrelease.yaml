apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-cloud
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: k8s-monitoring
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  valuesFrom:
    - kind: Secret
      name: grafana-cloud-k8s-monitoring-values
      valuesKey: values.yaml
